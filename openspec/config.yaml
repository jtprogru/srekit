schema: spec-driven
context: |
  srekit — CLI-генератор текстовых артефактов SRE (investigation log, postmortem, runbook, RFC/ADR, on-call report, SLO, error budget policy, changelog). Извлечён из монолита gch. Pre-1.0 (линия 0.30.x). Команды capacity, retro и license удалены в 0.30.0.

  Стек и границы:
  - Go 1.26, зависимости в проде — только spf13/cobra и go.yaml.in/yaml/v3. Добавление зависимости взвешивается против размера бинаря: viper и google/uuid были выпилены именно поэтому (тянули afero → net/http → crypto/tls + FIPS-140). Ни crypto, ни net/http в графе сборки быть не должно.
  - Один статический бинарь, шаблоны вкомпилированы через //go:embed. Сети в рантайме нет; единственный внешний процесс — git.
  - Раскладка: main.go → cmd/ (один файл на команду) → internal/{tmpl,sections, render,cliflags,config,meta,ids,clock,migrate}. internal/* не является публичным API.

  Ключевые инварианты:
  - Единый output-контракт для всех генераторов: --out/--stdout/--force/--dry-run/--json плюс персистентный --quiet. Флаг, который команда молча игнорирует, считается дефектом (поэтому --template удалён совсем вместе с license — единственной командой, которая его honor-ила).
  - Формат шаблона v1 — один <name>.yaml на артефакт: version/frontmatter/title/ meta_bullets/header_body/sections. Порядок ключей frontmatter и порядок секций сохраняются. Ключи YAML — snake_case (аудитория правит их руками), ключи JSON — camelCase.
  - JSON-контракт ({meta, sections:[{id,title,type,body,required}]}) публичный и стабилизируется на 1.0. Тела секций из --from вставляются verbatim, без вычисления шаблонов.
  - Неизвестный section ID во входных данных — всегда ошибка, никогда не молчаливый пропуск.
  - Конфиг и шаблоны: XDG для новых установок, но существующий legacy-путь (~/.srekit.yaml, ~/.srekit/templates) выигрывает — пользователь не должен получить конфиг, который лежит и не читается.
  - Loader шаблонов живёт в cmd.Context(), не в package-level переменной: параллельные тесты не должны гоняться за глобальным состоянием.
  - Шаблоны (кроме changelog) двуязычные: заголовки «Русский (English)», тело по-русски. Технические идентификаторы (SLO/SLI/RFC/SEV/UTC/PromQL) и ключи frontmatter — английские. changelog целиком английский, чтобы не ломать тулинг вокруг Keep a Changelog.

  Конвенции:
  - Conventional commits. CHANGELOG.md ведётся руками в формате Keep a Changelog.
  - Тесты: unit на internal/*, smoke через cobra.Command.SetArgs на каждую команду, go test -race в CI, golangci-lint v2 (~50 линтеров). Тесты параллельные (t.Parallel).
  - Документация — MkDocs Material с i18n: docs/en и docs/ru поддерживаются синхронно. Правка поведения обязывает править обе локали.
  - Markdown не хардврапится: один абзац — одна строка.
rules:
  proposal:
    - "Явно указывай, ломает ли изменение публичный контракт: набор команд, имена и семантику флагов, формат JSON, формат шаблона v1, расположение конфига. Помечай **BREAKING**."
    - Если изменение добавляет зависимость — обоснуй влияние на размер бинаря и на граф сборки.
  specs:
    - "Пиши требования в терминах наблюдаемого поведения CLI: аргументы, stdout/stderr, код возврата, содержимое файла на диске. Не упоминай имена пакетов, типов и функций Go."
    - Флаг, который команда не honor-ит, спецификацией не описывается — он не должен существовать.
    - Для каждого пути с записью файла фиксируй поведение при уже существующем файле и при --dry-run.
  design:
    - Указывай, где живёт состояние. Package-level mutable state в этом проекте запрещён (см. историю с гонкой в загрузчике шаблонов).
    - Если решение влияет на размер бинаря или на список зависимостей — раздел об этом обязателен.
  tasks:
    - Всякая задача, меняющая поведение CLI, включает правку docs/en и docs/ru и запись в CHANGELOG.
    - Новый или изменённый артефакт требует smoke-теста в cmd/cmd_test.go.
operations:
  apply:
    guidance:
      - Перед завершением прогоняй go build ./... && go test -race ./... && golangci-lint run.
      - Проверяй, что обе локали документации обновлены, а не только английская.
  archive:
    guidance:
      - Убедись, что запись в CHANGELOG.md попала в [Unreleased], а не в уже выпущенную версию.
