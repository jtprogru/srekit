name: security

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.26.4"

jobs:
  govulncheck:
    name: govulncheck (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # govulncheck is pinned in the Makefile and installed into ./bin by the target.
      - name: Cache govulncheck
        uses: actions/cache@v6
        with:
          path: ./bin
          key: govulncheck-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            govulncheck-${{ runner.os }}-
      - name: Run govulncheck
        run: make govulncheck

  bearer:
    name: bearer (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bearer scan
        id: bearer
        uses: bearer/bearer-action@v2
        continue-on-error: true
        with:
          format: sarif
          output: bearer.sarif
          exit-code: "0"
      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('bearer.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: bearer.sarif
          category: bearer
