name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.4"

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The golangci-lint version is pinned in the Makefile, not here, so that
      # `make lint` locally and in CI resolve to the same binary.
      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: |
            ./bin
            ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            golangci-${{ runner.os }}-
      - name: golangci-lint
        run: make lint
