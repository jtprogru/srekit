version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: srekit
    main: main.go
    binary: srekit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    goarm:
      - "6"
      - "7"
    ldflags:
      - -s -w -X github.com/jtprogru/srekit/cmd.Version={{.Version}} -X github.com/jtprogru/srekit/cmd.Commit={{.Commit}} -X github.com/jtprogru/srekit/cmd.Date={{.CommitDate}} -X github.com/jtprogru/srekit/cmd.BuiltBy=goreleaser
    builder: go

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

signs:
  - artifacts: checksum
    cmd: gpg2
    args:
      - "--batch"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

# We ship via Homebrew cask (not formula) deliberately. The standard
# Homebrew convention is brew formula for CLI binaries, cask for GUI/.app,
# so the strictly-correct move would be to flip this to `brews:`. We keep
# cask because existing users installed via `brew install --cask srekit`
# and migrating them would mean a broken upgrade path. The post-install
# xattr hook is the price of staying on cask: Gatekeeper quarantines
# unsigned downloaded binaries on macOS, and stripping com.apple.quarantine
# is what makes the CLI runnable without a manual right-click-open.
homebrew_casks:
  - name: srekit
    repository:
      owner: jtprogru
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/jtprogru/srekit"
    description: "Generator of SRE text artifacts: tasks, postmortems, runbooks, RFCs, on-call reports, SLOs, retros, changelogs"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/srekit"]
          end
