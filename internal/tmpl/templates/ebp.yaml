version: 1

frontmatter:
  id: "{{ .Meta.ID }}"
  creation_date: "{{ .Meta.Now }}"
  modification_date: "{{ .Meta.Now }}"
  type: error-budget-policy
  service: "{{ .Meta.Service }}"
  tags:
    - error-budget
    - policy
    - reliability

title: "Политика бюджета ошибок (Error budget policy) — {{ .Meta.Service }}"

meta_bullets:
  - "**Сервис (Service):** {{ .Meta.Service }}"
  - "**Команда-владелец (Owner team):** _заполнить_"
  - "**Связанный SLO (Related SLO):** _ссылка на slo-{{ .Meta.Service }}.md_"
  - "**Дата принятия (Effective from):** {{ .Meta.Now }}"

sections:
  - id: purpose
    title: Назначение (Purpose)
    type: text
    default_body: |
      Документ фиксирует, что команда делает, когда бюджет ошибок горит или сгорел.
      Цель — заранее договориться о действиях, чтобы не спорить в момент инцидента.
  - id: triggers
    title: Триггеры (Triggers)
    type: table
    columns:
      - Состояние бюджета
      - Условие
    rows:
      - - '**Зелёный (Green)**'
        - потрачено < 50 % бюджета
      - - '**Жёлтый (Yellow)**'
        - потрачено 50–75 %
      - - '**Оранжевый (Orange)**'
        - потрачено 75–100 %
      - - '**Красный (Red)**'
        - бюджет исчерпан
  - id: tiered_actions
    title: Действия по уровням (Tiered actions)
    type: text
    default_body: |
      ### Жёлтый (Yellow) — 50–75 %

      - Reliability обсуждается на ближайшем стендапе.
      - Новая фича-PR требует review с упоминанием влияния на бюджет.

      ### Оранжевый (Orange) — 75–100 %

      - Заморозка не-критичных деплоев feature-кода.
      - ≥ 25 % инженерного времени уходит на reliability-работу.
      - Уведомление stakeholders (ссылка / список).

      ### Красный (Red) — бюджет исчерпан

      - Полная заморозка фич-деплоев до восстановления бюджета.
      - Все инженеры команды на reliability-работе.
      - Постмортем каждого выгоревшего инцидента обязателен.
  - id: exceptions
    title: Исключения (Exceptions)
    type: text
    default_body: |
      _Когда заморозку можно временно снять (security-fix, регуляторный дедлайн и т.п.). Кто авторизует._

      -
  - id: escalation
    title: Эскалация (Escalation)
    type: text
    default_body: |
      - Команда → _имя/роль_
      - Tech lead → _имя/роль_
      - Engineering manager → _имя/роль_
  - id: review
    title: Пересмотр (Review)
    type: text
    default_body: |
      - Ежеквартально или после крупного изменения SLO.
  - id: references
    title: Ссылки (References)
    type: text
    default_body: |
      -
