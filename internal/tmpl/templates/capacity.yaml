version: 1

frontmatter:
  id: "{{ .Meta.ID }}"
  creation_date: "{{ .Meta.Now }}"
  modification_date: "{{ .Meta.Now }}"
  type: capacity-plan
  service: "{{ .Meta.Service }}"
  horizon: "{{ .Meta.Horizon }}"
  tags:
    - capacity
    - planning
    - reliability

title: "План ёмкости (Capacity plan) — {{ .Meta.Service }}"

meta_bullets:
  - "**Сервис (Service):** {{ .Meta.Service }}"
  - "**Команда-владелец (Owner team):** _заполнить_"
  - "**Горизонт планирования (Horizon):** {{ .Meta.Horizon }}"
  - "**Дата плана (Plan date):** {{ .Meta.Now }}"

sections:
  - id: current_capacity
    title: Текущая ёмкость (Current capacity)
    type: table
    columns:
      - Метрика
      - Текущее
      - Пиковое (P99)
      - Утилизация
    rows:
      - - RPS
        - ""
        - ""
        - ""
      - - CPU
        - ""
        - ""
        - ""
      - - Память
        - ""
        - ""
        - ""
      - - Storage
        - ""
        - ""
        - ""
      - - Соединения
        - ""
        - ""
        - ""
  - id: growth_assumptions
    title: Допущения роста (Growth assumptions)
    type: text
    default_body: |
      _На каких цифрах основан прогноз. Источник: продуктовый план, исторические данные, маркетинг._

      - Драйвер роста: _что увеличивает нагрузку_
      - Ожидаемый темп: _X % MoM / QoQ_
      - Сезонность: _да/нет, паттерн_
  - id: forecast
    title: Прогноз (Forecast)
    type: table
    columns:
      - Период
      - Ожидаемый RPS
      - Требуемая ёмкость
      - Запас
    rows:
      - - Сейчас
        - ""
        - ""
        - ""
      - - +1 квартал
        - ""
        - ""
        - ""
      - - +2 квартала
        - ""
        - ""
        - ""
      - - Конец горизонта
        - ""
        - ""
        - ""
  - id: scale_up_triggers
    title: Триггеры скейла (Scale-up triggers)
    type: text
    default_body: |
      _Конкретные условия, при которых добавляем ресурсы. Привязка к метрике, не к ощущениям._

      - При CPU > _N %_ в течение _M минут_ → _действие_
      - При утилизации памяти > _N %_ → _действие_
      - При длине очереди > _N_ → _действие_
  - id: target_headroom
    title: Целевой headroom (Target headroom)
    type: text
    default_body: |
      _Сколько свободной ёмкости держим. Типовое значение: 30–50 %._

      - Целевой headroom: _X %_
      - Обоснование: _почему столько, что заложено в запас_
  - id: dependencies
    title: Зависимости (Dependencies)
    type: text
    default_body: |
      - Upstream-сервисы, которые могут стать боттлнеком: _список_
      - Shared resources (БД, кэши, очереди): _список_
      - Инфраструктурные ограничения (квоты, лимиты облака): _список_
  - id: cost_implications
    title: Стоимость (Cost implications)
    type: text
    default_body: |
      - Текущий месячный спенд: _$N_
      - Прогноз на конец горизонта: _$N_
      - Самые дорогие компоненты: _список_
  - id: risks
    title: Риски (Risks)
    type: table
    columns:
      - Риск
      - Вероятность
      - Влияние
      - Митигация
    rows:
      - - ""
        - ""
        - ""
        - ""
  - id: review
    title: Пересмотр (Review)
    type: text
    default_body: |
      - Ежеквартально или при значимом изменении нагрузки.
  - id: references
    title: Ссылки (References)
    type: text
    default_body: |
      -
