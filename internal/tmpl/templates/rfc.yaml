version: 1

frontmatter:
  id: "{{ .Meta.ID }}"
  creation_date: "{{ .Meta.Now }}"
  decision_date:
  status: "{{ .Meta.Status }}"
  type: rfc
  title: "{{ .Meta.Title }}"
  deciders: []
  supersedes:
  superseded_by:
  tags:
    - rfc
    - adr

title: "RFC-{{ shortID .Meta.ID 8 }} — {{ .Meta.Title }}"

meta_bullets:
  - "**Статус (Status):** {{ .Meta.Status }}"
  - "**Автор (Author):** {{ .Meta.Author.Name }} <{{ .Meta.Author.Email }}>"
  - "**Принимающие решение (Deciders):** _имена людей, чья подпись нужна_"
  - "**Создан (Created):** {{ .Meta.Now }}"
  - "**Решено (Decided):** _заполнить, когда статус станет accepted / rejected_"

sections:
  - id: context
    title: Контекст (Context)
    type: text
    default_body: |
      _В чём проблема? Какие силы в игре (технические, организационные, политические)?_
  - id: decision
    title: Решение (Decision)
    type: text
    default_body: |
      _Что мы собираемся сделать. Будь конкретен._
  - id: alternatives_considered
    title: Рассмотренные альтернативы (Alternatives considered)
    type: text
    default_body: |
      1. **Вариант A** — _почему нет_
      2. **Вариант B** — _почему нет_
  - id: consequences
    title: Последствия (Consequences)
    type: text
    default_body: |
      ### Плюсы (Positive)

      -

      ### Минусы (Negative)

      -

      ### Нейтральное / последующее (Neutral / follow-up)

      -
  - id: references
    title: Ссылки (References)
    type: text
    default_body: |
      -
