# yaml-language-server: $schema=https://taskfile.dev/schema.json
---
version: "3"

vars:
  BINARY_NAME: srekit
  GOPATH:
    sh: echo $GOPATH

tasks:
  default:
    cmds: [task --list]
    silent: true

  run:
    desc: Run via go run
    cmds: ["go run . {{ .CLI_ARGS }}"]

  tidy:
    cmds: ["go mod tidy"]

  build:
    desc: Build binary into ./dist
    cmds:
      - "go mod download"
      - "CGO_ENABLED=0 go build -o ./dist/{{ .BINARY_NAME }} ."

  fmt:
    cmds: ["gofmt -s -w ."]

  vet:
    cmds: ["go vet ./..."]

  test:
    desc: Run unit tests with coverage
    cmds: ["go test --short -coverprofile=cover.out -v ./..."]

  test:race:
    desc: Run tests with the race detector (matches CI)
    cmds: ["go test -race -v ./..."]

  lint:
    desc: Run golangci-lint
    cmds: ["golangci-lint -v run"]

  ci:
    desc: Run everything CI runs (lint + race tests). Quick local pre-push check.
    cmds:
      - task: lint
      - task: test:race

  release:dry:
    desc: Goreleaser dry-run (no publish; binaries land in ./dist)
    cmds: ["goreleaser release --clean --snapshot --skip=publish,sign"]

  install:
    cmds: ["go install"]
