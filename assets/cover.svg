<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="srekit — generates SRE text artifacts: postmortems, runbooks, SLOs, RFCs, changelogs">
  <title>srekit</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#10161f"/>
      <stop offset="100%" stop-color="#0f1226"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C7CFF"/>
      <stop offset="100%" stop-color="#3fa7c9"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6C7CFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6C7CFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <style>
      .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .dim  { fill: #8b949e; }
      .fg   { fill: #e6edf3; }
      .ind  { fill: #8b9dff; }
      .grn  { fill: #5BB359; }
      .cyn  { fill: #58c6d8; }
      .yel  { fill: #d8a657; }
      .red  { fill: #f0796a; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="1060" cy="120" rx="460" ry="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <!-- brand block -->
  <g transform="translate(72, 96)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#6C7CFF" fill-opacity="0.14" stroke="#6C7CFF" stroke-opacity="0.45"/>
    <text class="mono ind" x="16" y="19" font-size="13" letter-spacing="1.6">GO · SRE · CLI</text>

    <text class="mono fg" x="0" y="112" font-size="76" font-weight="700" letter-spacing="-1.5">srekit</text>

    <text class="sans dim" x="2" y="158" font-size="24">Generates the SRE paperwork: postmortems, runbooks, SLOs, RFCs, changelogs.</text>
    <text class="sans dim" x="2" y="192" font-size="24">A single Go binary. Templates are v1 YAML, output is markdown.</text>
  </g>

  <!-- terminal -->
  <g transform="translate(72, 330)" filter="url(#shadow)">
    <rect x="0" y="0" width="1136" height="232" rx="14" fill="#0a0e14" stroke="#2a313c"/>
    <rect x="0" y="0" width="1136" height="40" rx="14" fill="#161b22"/>
    <rect x="0" y="26" width="1136" height="14" fill="#161b22"/>
    <line x1="0" y1="40" x2="1136" y2="40" stroke="#2a313c"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="20" r="6" fill="#febc2e"/>
    <circle cx="68" cy="20" r="6" fill="#28c840"/>
    <text class="mono dim" x="568" y="25" font-size="13" text-anchor="middle">~/work/api-gw — zsh</text>

    <text class="mono" x="28" y="82" font-size="19"><tspan class="grn">➜</tspan><tspan class="cyn" dx="12">api-gw</tspan><tspan class="yel" dx="12">git:(</tspan><tspan class="grn">main</tspan><tspan class="yel">)</tspan><tspan class="fg" dx="14">srekit postmortem -T</tspan><tspan class="yel" dx="10">&#34;API outage&#34;</tspan><tspan class="fg" dx="10">--severity</tspan><tspan class="red" dx="10">SEV-1</tspan></text>
    <text class="mono fg" x="28" y="114" font-size="19" fill-opacity="0.92">postmortem-api-outage.md</text>

    <text class="mono" x="28" y="160" font-size="19"><tspan class="grn">➜</tspan><tspan class="cyn" dx="12">api-gw</tspan><tspan class="yel" dx="12">git:(</tspan><tspan class="grn">release/1.2</tspan><tspan class="yel">)</tspan><tspan class="fg" dx="14">srekit changelog release --version</tspan><tspan class="ind" dx="10">1.2.0</tspan></text>
    <text class="mono fg" x="28" y="192" font-size="19" fill-opacity="0.92">CHANGELOG.md: [Unreleased] → ## [1.2.0] - 2026-08-12</text>
    <text class="mono dim" x="28" y="216" font-size="15">… everything else in the file came out byte-identical to what went in</text>
  </g>

  <!-- artifact chips -->
  <g transform="translate(72, 604)" class="mono" font-size="14">
    <g>
      <rect x="0" y="-18" width="112" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="56" y="0" text-anchor="middle">postmortem</text>
    </g>
    <g transform="translate(122, 0)">
      <rect x="0" y="-18" width="87" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="43" y="0" text-anchor="middle">runbook</text>
    </g>
    <g transform="translate(219, 0)">
      <rect x="0" y="-18" width="62" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="31" y="0" text-anchor="middle">task</text>
    </g>
    <g transform="translate(291, 0)">
      <rect x="0" y="-18" width="53" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="26" y="0" text-anchor="middle">rfc</text>
    </g>
    <g transform="translate(354, 0)">
      <rect x="0" y="-18" width="53" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="26" y="0" text-anchor="middle">slo</text>
    </g>
    <g transform="translate(417, 0)">
      <rect x="0" y="-18" width="53" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="26" y="0" text-anchor="middle">ebp</text>
    </g>
    <g transform="translate(480, 0)">
      <rect x="0" y="-18" width="137" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="68" y="0" text-anchor="middle">oncall-report</text>
    </g>
    <g transform="translate(627, 0)">
      <rect x="0" y="-18" width="104" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#2a313c"/>
      <text class="dim" x="52" y="0" text-anchor="middle">changelog</text>
    </g>
    <g transform="translate(741, 0)">
      <rect x="0" y="-18" width="150" height="26" rx="13" fill="#6C7CFF" fill-opacity="0.10" stroke="#6C7CFF" stroke-opacity="0.35"/>
      <text class="ind" x="75" y="0" text-anchor="middle">your templates</text>
    </g>
  </g>

  <text class="mono dim" x="1208" y="604" font-size="14" text-anchor="end">github.com/jtprogru/srekit</text>
</svg>
